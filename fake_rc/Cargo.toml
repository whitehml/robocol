[package]
name = "fake_rc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone fake FTC Robot Controller for hardware-free testing"

[[bin]]
name = "fake_rc"
path = "src/main.rs"

[dependencies]
robocol = { path = "../robocol" }
serde_json = "1"
# fake_rc encodes its synthetic camera frames as JPEG for the MJPEG server.
jpeg-encoder = "0.7"
